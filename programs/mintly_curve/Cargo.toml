[package]
name = "mintly_curve"
version = "0.1.0"
edition = "2021"
description = "Бондинг-кривая Mintly для Solana"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.1.0"
borsh = "1.5"
spl-token = { version = "7.0", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
