[package]
name = "mintly_curve"
version = "0.1.0"
edition = "2021"
description = "Бондинг-кривая Mintly для Solana"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = { version = "2.1.0", default-features = false }

[profile.release]
# Размер программы — это её аренда в сети: каждый лишний килобайт стоит
# денег при развёртывании. Поэтому оптимизация по размеру, а не по
# скорости: инструкции здесь короткие, считать в них почти нечего.
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
