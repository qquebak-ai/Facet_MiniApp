# Вход в API. Ставится в /etc/nginx/sites-available/mintly-api
# и включается ссылкой в sites-enabled.
#
# Сертификат выпускает certbot (см. server/README.md): он сам допишет
# сюда блок 443 и перенаправление с 80. Здесь — то, что не выпишет никто:
# заголовки для обработчиков, сжатие и разумные сроки ожидания.

# Ограничитель на случай, если кто-то решит опрашивать нас в тысячу
# потоков. Объявляется вне server: этот файл подключается внутрь блока
# http, а внутри server такое объявление nginx не примет.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream mintly_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mintly.company;

    # Сжатие ответов: лента и свечи — это json на десятки килобайт, и по
    # мобильной сети разница заметна больше, чем время самого ответа.
    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    location / {
        # Обычному приложению двадцати запросов в секунду хватает с
        # большим запасом, всплески гасит очередь.
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://mintly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обход ленты и сборка свопа ходят к чужим сервисам и бывают
        # небыстрыми: короткий срок обрывал бы их на полпути.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Сам сайт. Раздаёт его та же служба: собранные файлы лежат рядом с
# кодом, и выкладка — это git pull и сборка, без чужой очереди.
server {
    listen 80;
    listen [::]:80;
    server_name mintly.company www.mintly.company;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 512;

    # Загрузки на сервер (картинка токена при запуске) бывают в
    # несколько мегабайт: предел по умолчанию в мегабайт их обрывает.
    client_max_body_size 12m;

    location / {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://mintly_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
