# Уведомления о токенах.
#
# Обработчик /api/notify читает состояние кривых и пишет владельцам в
# Telegram. Дёргать его должен планировщик, но на бесплатном плане Vercel
# расписание срабатывает раз в сутки — покупку человек увидел бы через
# день. Поэтому зовём отсюда: у GitHub Actions расписание бесплатное.
#
# Что нужно один раз: в настройках репозитория (Settings → Secrets and
# variables → Actions → New repository secret) завести секрет CRON_SECRET
# с тем же значением, что стоит в переменных Vercel.

name: Уведомления

on:
  schedule:
    # Каждые 10 минут. GitHub может запаздывать на несколько минут —
    # для сообщений о покупках это незаметно.
    - cron: "*/10 * * * *"
  # Кнопка «запустить сейчас» на вкладке Actions.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Позвать обработчик
        run: |
          code=$(curl -s -o /tmp/otvet -w "%{http_code}" -X POST \
            "https://mintly.company/api/notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "ответ: $code"
          cat /tmp/otvet
          # Падаем только на отказе сервера: 401 значит секрет не совпал,
          # и это стоит увидеть в списке запусков.
          test "$code" = "200"
