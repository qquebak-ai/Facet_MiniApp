# Обход биржевых лент.
#
# Ленту в базу складывает /api/refresh-feed, а звать его должен
# планировщик. На бесплатном плане Vercel расписание срабатывает раз в
# сутки — цифры на витрине были бы вчерашними, поэтому зовём отсюда.
#
# GitHub не запускает расписание чаще, чем раз в пять минут, и нередко
# опаздывает. Поэтому один запуск сам ходит по кругу примерно пять минут
# с шагом в минуту: между запусками не остаётся дыры, а обход по-прежнему
# приходит раз в минуту, как и задумано.
#
# Что нужно один раз: в настройках репозитория (Settings → Secrets and
# variables → Actions) завести секрет CRON_SECRET с тем же значением, что
# стоит в переменных Vercel.

name: Обход ленты

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Второй запуск поверх идущего не нужен: он только выберет лимит
# источника, а строки перезапишет теми же.
concurrency:
  group: обход-ленты
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Обойти ленту пять раз с шагом в минуту
        run: |
          # Имена латиницей: кириллические переменные bash не принимает.
          fails=0
          for step in 1 2 3 4 5; do
            # Сети по очереди: обе за один вызов не укладываются в
            # отведённое обработчику время, и Solana не доходила до записи.
            for net in ton solana; do
              code=$(curl -s -o /tmp/otvet -w "%{http_code}" --max-time 110 \
                "https://mintly.company/api/refresh-feed?chain=$net" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
              echo "шаг $step $net: $code $(head -c 200 /tmp/otvet)"
              # 401 значит секрет не совпал — это стоит увидеть красным.
              if [ "$code" = "401" ]; then exit 1; fi
              if [ "$code" != "200" ]; then fails=$((fails + 1)); fi
            done
            if [ "$step" != "5" ]; then sleep 55; fi
          done
          # Разовый отказ источника — обычное дело, а пять подряд значит,
          # что сломан обход.
          test "$fails" -lt 10
